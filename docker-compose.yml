services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: automotive-backend
    command: uvicorn backend.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - OBD_DATA_PATH=/app/data/obd/obd_codes.csv
      - MAINTENANCE_DATA_PATH=/app/data/maintenance/maintenance.csv
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: automotive-frontend
    command: streamlit run frontend/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
